<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up | OnlineCourse</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:520px">
  <h1>Create an account</h1>
  {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
  <form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    <label class="form-label" for="username">Username</label>
    <input class="form-control mb-3" id="username" name="username" required>
    <label class="form-label" for="firstname">First name</label>
    <input class="form-control mb-3" id="firstname" name="firstname">
    <label class="form-label" for="lastname">Last name</label>
    <input class="form-control mb-3" id="lastname" name="lastname">
    <label class="form-label" for="psw">Password</label>
    <input class="form-control mb-3" id="psw" name="psw" type="password" required minlength="8">
    <button class="btn btn-success" type="submit">Sign up</button>
  </form>
  <p class="mt-3"><a href="{% url 'onlinecourse:login' %}">Already have an account?</a></p>
</main></body></html>
