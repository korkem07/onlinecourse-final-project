<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | OnlineCourse</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:520px">
  <h1>Login</h1>
  {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
  <form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    <label class="form-label" for="username">Username</label>
    <input class="form-control mb-3" id="username" name="username" required>
    <label class="form-label" for="password">Password</label>
    <input class="form-control mb-3" id="password" name="psw" type="password" required>
    <button class="btn btn-primary" type="submit">Login</button>
  </form>
  <p class="mt-3"><a href="{% url 'onlinecourse:registration' %}">Create account</a> · <a href="{% url 'onlinecourse:index' %}">Back to courses</a></p>
</main></body></html>
